ime.name=微软拼音中英切换
ime.pageTitle=输入法工具
ime.startupBalloon=按 {0} 切换中英文。右键图标可设置。
ime.hotkeyLabel=切换组合键：
ime.hotkeyNote=点击“录制...”后直接按下新的组合键即可更换（需包含 Win/Ctrl/Alt/Shift 至少一个）。
ime.strategyLabel=切换策略：
ime.strategyAuto=自动切换到微软拼音，再切换中英文
ime.strategyPinyinOnly=仅当微软拼音为当前输入法时切换（否则放行系统默认行为）
ime.debounceLabel=防误触时间（秒）：
ime.debounceNote=按下快捷键后，该时间内的再次触发只会被拦截、不会重复切换，避免键盘双击造成中英来回切换。设为 0 可关闭。
ime.debounceTooltip=按下快捷键后，在该时间内的再次触发会被忽略，防止键盘双击造成中英文来回切换。默认 0.3 秒，设为 0 可关闭。
ime.suppressLabel=防开始菜单按键：
ime.suppressNote=组合键触发时会注入该按键的按下/抬起，使系统认为 Win 被用于组合键而不弹出开始菜单。若被其它软件占用（如全局快捷键），请更换。
ime.suppressTooltip=组合键触发时会注入该按键的按下/抬起，使系统认为 Win 被用于组合键而不弹出开始菜单。若该键被其它软件占用（如全局快捷键），请更换为其它按键。
ime.trayToggle=切换中英文 ({0})
ime.hookFailText=全局键盘钩子安装失败（错误码 {0}）。快捷键将不可用，但仍可通过托盘菜单手动切换。

proxyfix.name=代理修复
proxyfix.pageTitle=启动策略
proxyfix.toggleLabel=开机自启动时自动修复代理问题
proxyfix.toggleNote=开启后，程序每次启动时若检测到系统代理已开启，会自动关闭（ProxyEnable=0），解决第三方 VPN 异常退出后残留代理导致的断网。
proxyfix.toggleTooltip=开启后，程序每次启动时若检测到系统代理已开启，会自动关闭（ProxyEnable=0），解决第三方 VPN 异常退出后残留代理导致的断网。

